[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pictosint-by-pravin"
version = "1.0.0"
description = "Image geolocation and satellite-verification toolkit for OSINT research"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Pravin S."}
]
dependencies = [
  "Pillow>=10.0",
  "pytesseract>=0.3.10",
  "requests>=2.31",
  "numpy>=1.26"
]

[project.urls]
Repository = "https://github.com/YOUR-USERNAME/pictosint_by_pravin"
LinkedIn = "https://www.linkedin.com/in/pravin-s-575102252"
